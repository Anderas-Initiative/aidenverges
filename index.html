
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090f">
    <meta name="description" content="The page you're looking for could not be found.">

    <title>404 — Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-effects">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div id="particles"></div>
    </div>

    <header class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">V</span>
            <span>YOUR BRAND</span>
        </a>

        <span class="status">
            <span class="status-dot"></span>
            SYSTEM OPERATIONAL
        </span>
    </header>

    <main class="error-container">

        <div class="error-label">
            <span class="label-line"></span>
            ERROR CODE: 404
            <span class="label-line"></span>
        </div>

        <h1 class="error-number">4<span>0</span>4</h1>

        <h2>Well, this is awkward.</h2>

        <p class="description">
            The page you're looking for doesn't exist, has been moved,
            or may have taken an unexpected vacation.
        </p>

        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <span>Return Home</span>
                <span class="arrow">↗</span>
            </a>

            <button class="btn btn-secondary" onclick="goBack()">
                Go Back
            </button>
        </div>

        <div class="error-details">
            <span>HTTP STATUS</span>
            <strong>404 NOT FOUND</strong>
            <span class="separator">/</span>
            <span id="current-time">00:00:00</span>
        </div>

    </main>

    <footer>
        <span>© <span id="year"></span> YOUR BRAND. All rights reserved.</span>
        <span class="footer-right">BUILT WITH PRECISION.</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
